<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECUST 宿舍电费统计</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: #fff;
      padding: 24px 0 80px;
      text-align: center;
    }
    .header h1 { font-size: 24px; font-weight: 600; }
    .header p { font-size: 14px; opacity: 0.85; margin-top: 6px; }
    .container { max-width: 1200px; margin: -56px auto 40px; padding: 0 16px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }
    .card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
    .card .value { font-size: 28px; font-weight: 700; }
    .card .unit { font-size: 14px; font-weight: 400; color: #666; margin-left: 4px; }
    .card .sub { font-size: 12px; color: #aaa; margin-top: 6px; }
    .card.warn .value { color: #e53935; }
    .card.ok .value { color: #43a047; }
    .card.info .value { color: #1a73e8; }

    .charts { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 900px) { .charts { grid-template-columns: 1fr 1fr; } }
    .chart-box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .chart-box h3 { font-size: 15px; color: #555; margin-bottom: 12px; }
    .chart-full { grid-column: 1 / -1; }

    /* 充值记录区域 */
    .recharge-panel {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .recharge-panel h3 { font-size: 15px; color: #555; margin-bottom: 12px; }
    .recharge-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; color: #888; }
    .form-group input, .form-group select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #1a73e8; }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      background: #1a73e8;
      color: #fff;
      transition: background 0.2s;
    }
    .btn:hover { background: #155ab6; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-danger { background: #e53935; }
    .btn-danger:hover { background: #c62828; }
    .btn-secondary { background: #888; }
    .btn-secondary:hover { background: #666; }

    .recharge-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .recharge-tag {
      background: #fff3e0;
      border: 1px solid #ffb74d;
      color: #e65100;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .recharge-tag .del { cursor: pointer; color: #c62828; font-weight: bold; }
    .recharge-summary { font-size: 13px; color: #555; padding: 8px 0; }
    .export-box {
      width: 100%;
      min-height: 80px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .github-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .github-row input[type=password] {
      flex: 1; min-width: 200px;
      padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 13px; font-family: monospace;
    }
    .status { font-size: 12px; padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .status.ok { background: #e8f5e9; color: #2e7d32; }
    .status.err { background: #ffebee; color: #c62828; }
    .status.loading { background: #e3f2fd; color: #1565c0; }
    .help-link { color: #1a73e8; font-size: 12px; text-decoration: none; }
    .help-link:hover { text-decoration: underline; }

    .footer { text-align: center; padding: 20px; color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ECUST 宿舍电费统计</h1>
    <p id="updateTime"></p>
  </div>
  <div class="container">
    <div class="cards">
      <div class="card" id="cardRemain">
        <div class="label">当前剩余电量</div>
        <div class="value" id="valRemain">--<span class="unit">kWh</span></div>
        <div class="sub" id="subRemain"></div>
      </div>
      <div class="card" id="cardCost">
        <div class="label">预估剩余电费</div>
        <div class="value" id="valCost">--<span class="unit">元</span></div>
        <div class="sub">按 0.617 元/kWh</div>
      </div>
      <div class="card info" id="cardDaily">
        <div class="label">昨日用电</div>
        <div class="value" id="valDaily">--<span class="unit">kWh</span></div>
        <div class="sub" id="subDaily"></div>
      </div>
      <div class="card" id="cardDays">
        <div class="label">预计可用天数</div>
        <div class="value" id="valDays">--<span class="unit">天</span></div>
        <div class="sub" id="subDays"></div>
      </div>
      <div class="card" id="cardRechargeSum">
        <div class="label">累计充值</div>
        <div class="value" id="valRechargeSum">0<span class="unit">元</span></div>
        <div class="sub" id="subRechargeSum">充入约 0 kWh</div>
      </div>
    </div>

    <div class="recharge-panel">
      <h3>充值记录</h3>
      <div class="recharge-form">
        <div class="form-group">
          <label>充值日期</label>
          <input type="date" id="rechargeDate" required>
        </div>
        <div class="form-group">
          <label>金额（元）</label>
          <input type="number" id="rechargeAmount" min="1" step="1" placeholder="例如：100" required>
        </div>
        <button class="btn" id="btnAddRecharge">添加充值</button>
        <button class="btn" id="btnSaveGithub">💾 保存到 GitHub</button>
        <button class="btn btn-secondary" id="btnExport">📋 仅复制 JSON</button>
      </div>
      <div class="recharge-list" id="rechargeList"></div>
      <div style="margin-top:8px;font-size:12px;color:#888;">
        点击"保存到 GitHub"会跳转到 GitHub 编辑页面（由 GitHub 自己处理登录），无需 token。需要仓库写权限。
      </div>
      <span id="ghStatus"></span>
      <textarea class="export-box" id="exportBox" readonly></textarea>
    </div>

    <div class="charts">
      <div class="chart-box chart-full">
        <h3>剩余电量与电费趋势</h3>
        <div id="chartMain" style="height:360px;"></div>
      </div>
      <div class="chart-box">
        <h3>每日用电量（近 30 天）</h3>
        <div id="chartDaily" style="height:300px;"></div>
      </div>
      <div class="chart-box">
        <h3>用电时段分析（平均速率）</h3>
        <div id="chartPeriod" style="height:300px;"></div>
      </div>
      <div class="chart-box chart-full">
        <h3>月度用电统计</h3>
        <div id="chartMonthly" style="height:300px;"></div>
      </div>
    </div>
  </div>
  <div class="footer">数据来源：华东理工大学电费系统 · 每 4 小时自动更新</div>

  <script src="./data.js"></script>
  <script src="./recharges.js"></script>
  <script>
    const PRICE = 0.617;
    const WARN_THRESHOLD = 10;
    const RECHARGE_STORAGE_KEY = 'ecust_recharges_v1';

    // 合并本地存储和 recharges.js 的数据（本地优先，去重）
    function loadRecharges() {
      let stored = [];
      try { stored = JSON.parse(localStorage.getItem(RECHARGE_STORAGE_KEY) || '[]'); } catch (e) {}
      // 文件中的数据作为初始数据（首次部署时已有记录）
      const fromFile = (typeof window.__recharges !== 'undefined' && Array.isArray(window.__recharges)) ? window.__recharges : [];
      // 合并：本地优先
      const seen = new Set();
      const merged = [];
      for (const r of stored) {
        const k = r.time + '|' + r.yuan;
        if (!seen.has(k)) { seen.add(k); merged.push(r); }
      }
      for (const r of fromFile) {
        const k = r.time + '|' + r.yuan;
        if (!seen.has(k)) { seen.add(k); merged.push(r); }
      }
      return merged.sort((a, b) => a.time.localeCompare(b.time));
    }

    function saveRecharges(list) {
      localStorage.setItem(RECHARGE_STORAGE_KEY, JSON.stringify(list));
    }

    // 把 recharges.js 里的全局变量挪到 window.__recharges，避免与下方 let 冲突
    window.__recharges = (typeof window.recharges !== 'undefined' && Array.isArray(window.recharges)) ? window.recharges : [];

    let recharges = loadRecharges();

    function toHour(t) { return t.includes(' ') ? parseInt(t.split(' ')[1].split(':')[0]) : null; }
    function toMinute(t) { return t.includes(' ') ? parseInt(t.split(' ')[1].split(':')[1]) : 0; }

    function toDate(t) {
      const parts = t.split(' ');
      if (!parts[1]) return parts[0];
      const d = new Date(parts[0] + 'T00:00');
      const h = parseInt(parts[1].split(':')[0]);
      const m = parseInt(parts[1].split(':')[1]);
      if (h < 5 || (h === 5 && m < 30)) {
        d.setDate(d.getDate() - 1);
      }
      return d.toISOString().slice(0, 10);
    }

    const dailyData = data.map((d, i) => {
      const usage = i > 0 ? +(data[i - 1].kWh - d.kWh).toFixed(1) : 0;
      return { ...d, usage };
    });

    const dateMap = {};
    for (const d of data) {
      const dt = toDate(d.time);
      if (!(dt in dateMap) || d.kWh < dateMap[dt]) dateMap[dt] = d.kWh;
    }
    const dateEntries = Object.entries(dateMap).sort((a, b) => a[0].localeCompare(b[0]));

    const last = dailyData[dailyData.length - 1];
    const remain = last.kWh;
    const cost = (remain * PRICE).toFixed(2);

    let usage = 0;
    if (dateEntries.length >= 2) {
      usage = +(dateEntries[dateEntries.length - 2][1] - dateEntries[dateEntries.length - 1][1]).toFixed(1);
    }

    document.getElementById('updateTime').textContent = '最近更新：' + last.time;
    document.getElementById('valRemain').innerHTML = remain + '<span class="unit">kWh</span>';
    document.getElementById('valCost').innerHTML = cost + '<span class="unit">元</span>';
    document.getElementById('valDaily').innerHTML = (usage >= 0 ? usage : 0) + '<span class="unit">kWh</span>';

    const cardRemain = document.getElementById('cardRemain');
    if (remain < WARN_THRESHOLD) {
      cardRemain.classList.add('warn');
      document.getElementById('subRemain').textContent = '⚠ 低于警告阈值 ' + WARN_THRESHOLD + ' kWh';
    } else {
      cardRemain.classList.add('ok');
      document.getElementById('subRemain').textContent = '状态正常';
    }

    if (usage > 0) {
      document.getElementById('subDaily').textContent = '费用约 ' + (usage * PRICE).toFixed(2) + ' 元';
    } else {
      document.getElementById('subDaily').textContent = '';
    }

    const recent7dates = dateEntries.slice(-8);
    let avgDaily = 0;
    for (let i = 1; i < recent7dates.length; i++) {
      avgDaily += recent7dates[i - 1][1] - recent7dates[i][1];
    }
    avgDaily = avgDaily / (recent7dates.length - 1);
    const daysLeft = avgDaily > 0 ? Math.floor(remain / avgDaily) : '∞';
    document.getElementById('valDays').innerHTML = daysLeft + '<span class="unit">天</span>';
    document.getElementById('subDays').textContent = '基于近 7 天均耗 ' + avgDaily.toFixed(1) + ' kWh/天';
    if (typeof daysLeft === 'number' && daysLeft < 7) {
      document.getElementById('cardDays').classList.add('warn');
    }

    // --- 充值统计卡片 ---
    const totalYuan = recharges.reduce((s, r) => s + Number(r.yuan), 0);
    const totalKWh = totalYuan / PRICE;
    document.getElementById('valRechargeSum').innerHTML = totalYuan.toFixed(0) + '<span class="unit">元</span>';
    document.getElementById('subRechargeSum').textContent = '共 ' + recharges.length + ' 次，约 ' + totalKWh.toFixed(0) + ' 度';

    // --- 充值列表 UI ---
    function renderRechargeList() {
      const list = document.getElementById('rechargeList');
      if (recharges.length === 0) {
        list.innerHTML = '<div style="color:#999;font-size:13px;">暂无充值记录</div>';
        return;
      }
      list.innerHTML = recharges.map((r, idx) =>
        `<div class="recharge-tag">${r.time} · ¥${r.yuan}<span class="del" data-idx="${idx}" title="删除">×</span></div>`
      ).join('');
      list.querySelectorAll('.del').forEach(el => {
        el.onclick = function() {
          const idx = parseInt(this.getAttribute('data-idx'));
          recharges.splice(idx, 1);
          saveRecharges(recharges);
          renderRechargeList();
          updateSummary();
        };
      });
    }

    function updateSummary() {
      const totalYuan = recharges.reduce((s, r) => s + Number(r.yuan), 0);
      const totalKWh = totalYuan / PRICE;
      document.getElementById('valRechargeSum').innerHTML = totalYuan.toFixed(0) + '<span class="unit">元</span>';
      document.getElementById('subRechargeSum').textContent = '共 ' + recharges.length + ' 次，约 ' + totalKWh.toFixed(0) + ' 度';
    }

    // 默认日期为今天
    document.getElementById('rechargeDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('btnAddRecharge').onclick = function() {
      const date = document.getElementById('rechargeDate').value;
      const yuan = Number(document.getElementById('rechargeAmount').value);
      if (!date || !yuan || yuan <= 0) {
        alert('请填写有效的日期和金额');
        return;
      }
      recharges.push({ time: date, yuan: yuan });
      recharges.sort((a, b) => a.time.localeCompare(b.time));
      saveRecharges(recharges);
      renderRechargeList();
      updateSummary();
      document.getElementById('rechargeAmount').value = '';
      // 自动隐藏导出框
      document.getElementById('exportBox').style.display = 'none';
    };

    document.getElementById('btnExport').onclick = function() {
      const exp = document.getElementById('exportBox');
      exp.value = 'recharges=' + JSON.stringify(recharges, null, 2);
      exp.style.display = 'block';
      exp.select();
      try {
        document.execCommand('copy');
        alert('JSON 已复制到剪贴板，请粘贴到 recharges.js 文件提交');
      } catch (e) {}
    };

    // 跳转到 GitHub 编辑页面（带预填内容）
    document.getElementById('btnSaveGithub').onclick = function() {
      // 从当前页面 URL 推断 owner/repo（GitHub Pages 路径格式：/ecust-electricity-statistics/）
      const pathParts = location.pathname.split('/').filter(p => p);
      const repo = pathParts[0] || 'ecust-electricity-statistics';
      const repoUrl = 'https://github.com/' + (location.hostname.includes('github.io') ? location.hostname.split('.')[0] : 'baibaidebai') + '/' + repo;
      const content = 'recharges=' + JSON.stringify(recharges, null, 2);
      const editUrl = repoUrl + '/edit/main/recharges.js?value=' + encodeURIComponent(content) + '&message=更新充值记录';
      window.open(editUrl, '_blank');
      document.getElementById('ghStatus').innerHTML = '<span class="status loading">已打开 GitHub 编辑页面，请在 GitHub 上点击 "Commit changes" 完成保存</span>';
    };

    renderRechargeList();

    // --- 主图表 ---
    const times = dailyData.map(d => d.time);
    const kWhs = dailyData.map(d => d.kWh);
    const costs = dailyData.map(d => +(d.kWh * PRICE).toFixed(2));

    // 充值标记线（用接近0的占位系列实现）
    const rechargeMarks = recharges.map(r => {
      const idx = times.findIndex(t => toDate(t) >= r.time);
      return { xAxis: idx >= 0 ? idx : times.length - 1, label: { formatter: '充¥' + r.yuan, color: '#e65100' } };
    });

    const chartMain = echarts.init(document.getElementById('chartMain'));
    chartMain.setOption({
      tooltip: { trigger: 'axis',
        formatter: function(params) {
          let s = params[0].axisValue + '<br/>';
          params.forEach(p => {
            s += p.marker + ' ' + p.seriesName + ': <b>' + p.value + '</b>' + (p.seriesIndex === 0 ? ' kWh' : ' 元') + '<br/>';
          });
          return s;
        }
      },
      legend: { data: ['剩余电量', '预估电费'], top: 0 },
      grid: { left: 60, right: 60, bottom: 60, top: 40 },
      dataZoom: [
        { type: 'inside', start: 0, end: 100 },
        { type: 'slider', start: 0, end: 100, height: 24, bottom: 8 }
      ],
      xAxis: { type: 'category', data: times, boundaryGap: false },
      yAxis: [
        { type: 'value', name: 'kWh', position: 'left' },
        { type: 'value', name: '元', position: 'right' }
      ],
      series: [
        {
          name: '剩余电量', type: 'line', data: kWhs, smooth: true,
          symbol: 'none', lineStyle: { width: 2 },
          areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(26,115,232,0.35)' },
            { offset: 1, color: 'rgba(26,115,232,0.02)' }
          ])},
          itemStyle: { color: '#1a73e8' },
          markLine: {
            silent: false,
            symbol: ['none', 'triangle'],
            data: [
              { yAxis: WARN_THRESHOLD, lineStyle: { color: '#e53935', type: 'dashed' },
                label: { formatter: '警告线 ' + WARN_THRESHOLD + 'kWh', color: '#e53935' }
              },
              ...rechargeMarks
            ]
          }
        },
        {
          name: '预估电费', type: 'line', data: costs, smooth: true,
          symbol: 'none', yAxisIndex: 1,
          lineStyle: { width: 2, type: 'dashed' },
          itemStyle: { color: '#fb8c00' }
        }
      ]
    });

    // --- 每日用电量 ---
    const dailyUsageArr = [];
    for (let i = 1; i < dateEntries.length; i++) {
      const u = +(dateEntries[i - 1][1] - dateEntries[i][1]).toFixed(1);
      if (u > 0) dailyUsageArr.push({ date: dateEntries[i][0], usage: u });
    }
    const recent30 = dailyUsageArr.slice(-30);
    const chartDaily = echarts.init(document.getElementById('chartDaily'));
    chartDaily.setOption({
      tooltip: {
        trigger: 'axis',
        formatter: function(params) {
          const p = params[0];
          return p.axisValue + '<br/>' + p.marker + ' 用电: <b>' + p.value + '</b> kWh<br/>费用: <b>' + (p.value * PRICE).toFixed(2) + '</b> 元';
        }
      },
      grid: { left: 50, right: 20, bottom: 30, top: 20 },
      xAxis: { type: 'category', data: recent30.map(d => d.date.slice(5)) },
      yAxis: { type: 'value', name: 'kWh' },
      series: [{
        type: 'bar', data: recent30.map(d => d.usage),
        itemStyle: {
          color: function(params) {
            return params.value > 5 ? '#e53935' : params.value > 3 ? '#fb8c00' : '#43a047';
          },
          borderRadius: [4, 4, 0, 0]
        }
      }]
    });

    // --- 用电时段分析 ---
    function parseDatetime(t) {
      return new Date(t.replace(' ', 'T') + (t.includes(':') ? '' : 'T00:00'));
    }
    const periodSlots = ['凌晨 0-6', '上午 6-12', '下午 12-18', '晚上 18-24'];
    const periodRateSum = [0, 0, 0, 0];
    const periodCount = [0, 0, 0, 0];
    for (let i = 1; i < data.length; i++) {
      const h = toHour(data[i - 1].time);
      if (h === null) continue;
      const u = data[i - 1].kWh - data[i].kWh;
      if (u <= 0) continue;
      const hours = (parseDatetime(data[i].time) - parseDatetime(data[i - 1].time)) / 3600000;
      if (hours <= 0) continue;
      const rate = u / hours;
      let slot;
      if (h < 6) slot = 0;
      else if (h < 12) slot = 1;
      else if (h < 18) slot = 2;
      else slot = 3;
      periodRateSum[slot] += rate;
      periodCount[slot]++;
    }
    const periodAvgRate = periodRateSum.map((sum, i) => periodCount[i] > 0 ? +(sum / periodCount[i]).toFixed(3) : 0);
    const chartPeriod = echarts.init(document.getElementById('chartPeriod'));
    chartPeriod.setOption({
      tooltip: {
        trigger: 'axis',
        formatter: function(params) {
          const p = params[0];
          const idx = p.dataIndex;
          return p.axisValue + '<br/>' + p.marker + ' 平均用电速率: <b>' + p.value + '</b> kWh/h<br/>采样次数: <b>' + periodCount[idx] + '</b>';
        }
      },
      grid: { left: 80, right: 60, bottom: 30, top: 20 },
      xAxis: { type: 'value', name: 'kWh/h' },
      yAxis: { type: 'category', data: periodSlots },
      series: [{
        type: 'bar',
        data: periodAvgRate.map((v, i) => ({
          value: v,
          itemStyle: { color: ['#5c6bc0', '#26a69a', '#ffa726', '#ef5350'][i] }
        })),
        label: { show: true, position: 'right', formatter: '{c} kWh/h' }
      }]
    });

    // --- 月度用电统计 ---
    const monthlyMap = {};
    for (let i = 1; i < dateEntries.length; i++) {
      const m = dateEntries[i][0].slice(0, 7);
      const u = dateEntries[i - 1][1] - dateEntries[i][1];
      if (u > 0) monthlyMap[m] = (monthlyMap[m] || 0) + u;
    }
    const monthLabels = Object.keys(monthlyMap).sort();
    const monthValues = monthLabels.map(m => +monthlyMap[m].toFixed(1));
    const chartMonthly = echarts.init(document.getElementById('chartMonthly'));
    chartMonthly.setOption({
      tooltip: {
        trigger: 'axis',
        formatter: function(params) {
          const p = params[0];
          return p.axisValue + '<br/>' + p.marker + ' 用电: <b>' + p.value + '</b> kWh<br/>费用: <b>' + (p.value * PRICE).toFixed(2) + '</b> 元';
        }
      },
      grid: { left: 50, right: 20, bottom: 30, top: 20 },
      xAxis: { type: 'category', data: monthLabels },
      yAxis: { type: 'value', name: 'kWh' },
      series: [{
        type: 'bar', data: monthValues,
        itemStyle: { color: '#1a73e8', borderRadius: [4, 4, 0, 0] }
      }]
    });

    window.addEventListener('resize', function() {
      chartMain.resize();
      chartDaily.resize();
      chartPeriod.resize();
      chartMonthly.resize();
    });
  </script>
</body>
</html>
